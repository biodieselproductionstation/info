* กองการเจ้าหน้าที่ (กจ.)
* กองคลัง (กค.)
* กองตรวจราชการ (กตร.)
* กองวิชาการและแผนงาน (วช.)
* วิทยาลัยการปกครอง (วปค.)
* ศูนย์สารสนเทศเพื่อการบริหารงานปกครอง (ศสป.)
* ศูนย์ปฏิบัติการต่อต้านการทุจริต กรมการปกครอง (ศปท.ปค.){{กลาง}}
