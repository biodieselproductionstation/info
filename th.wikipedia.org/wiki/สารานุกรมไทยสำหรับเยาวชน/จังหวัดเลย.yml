=== ฉบับกาญจนาภิเษก ===
'''หนังสือสารานุกรมไทย ฉบับกาญจนาภิเษก''' เป็นหนังสือสารานุกรม ที่จัดทำขึ้นเนื่องในโอกาส[[พระราชพิธีกาญจนาภิเษก พ.ศ. 2539]] โดย[[มูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชน|มูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ]] พิมพ์และจำหน่ายใน พ.ศ. 2542 ในราคา 500 บาท มีทั้งหมด 60 เรื่องโดยแบ่งเป็น 9 หมวด คือ 
* '''หมวดที่ 1''' พระราชประวัติและพระราชกรณียกิจสำคัญ
* '''หมวดที่ 2''' พระราชวงศ์
* '''หมวดที่ 3''' องค์กรและส่วนราชการ 
* '''หมวดที่ 4''' มูลนิธิ ทุน รางวัล และโรงเรียน
* '''หมวดที่ 5''' พระราชสถานะและพระราชอำนาจตามรัฐธรรมนูญ
* '''หมวดที่ 6''' ราชธรรมและพระราชกรณียกิจเกี่ยวกับศาสนา
* '''หมวดที่ 7''' พระราชพิธีในรัชกาลปัจจุบัน
* '''หมวดที่ 8''' พระบรมราชสัญลักษณ์และเรื่องราวเกี่ยวข้อง
* '''หมวดที่ 9''' เบ็ดเตล็ด

=== ฉบับเฉลิมพระเกียรติ ===
'''สารานุกรมไทย ฉบับเฉลิมพระเกียรติ''' เป็นหนังสือสารานุกรม ที่จัดทำขึ้นเนื่องในโอกาส[[พระราชพิธีฉลองสิริราชสมบัติครบ 60 ปี พ.ศ. 2549]] โดยมูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ พิมพ์และจำหน่ายในปี พ.ศ. 2550 ในราคา 500 บาท จัดทำขึ้นเพื่อเฉลิมพระเกียรติ[[พระบาทสมเด็จพระมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร]] โดยประมวลพระราชจริยาวัตร พระราชกรณียกิจ และพระปรีชาสามารถในด้านต่างๆ อันก่อให้เกิดประโยชน์ต่อประเทศชาติและอาณาประชาราษฎร์ ประกอบด้วยเนื้อหารายละเอียดดังนี้
* '''1.''' ธรรมิกราชา
* '''2.''' พระปรีชาสามารถด้านเทคโนโลยีและนวัตกรรม
* '''3.''' เศรษฐกิจพอเพียง
* '''4.''' กษัตริย์-เกษตร
* '''5.''' พระราชกรณียกิจด้านการแพทย์และการสาธารณสุข
* '''6.''' พระปรีชาสามารถด้านการพัฒนาปัญญา
* '''7.''' อัครศิลปิน
* '''8.''' พระราชกรณียกิจด้านการสืบสานวัฒนธรรมและขนบประเพณี
* '''9.''' สังคมสมานฉันท์

=== ฉบับเทิดพระเกียรติ ===
''สารานุกรมไทย ฉบับเทิดพระเกียรติ "ธรรมิกราชาธิคุณ"'' เป็นส่วนหนึ่งของทางมูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ เพื่อให้ประชาชนทุกคนได้รำลึกในพระมหากรุณาธิคุณในธรรมิกราชาที่พระบาทสมเด็จพระมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร ได้ทรงบำเพ็ญมาตลอดระยะเวลา 70 ปี มูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ จึงได้จัดทำหนังสือสารานุกรมไทย ฉบับเทิดพระเกียรติ โดยได้รวบรวมประมวลหลักธรรมซึ่ง[[พระบาทสมเด็จพระมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร]] ทรงยึดถือและปฏิบัติอย่างครบถ้วน และในหนังสือสารานุกรมฉบับนี้ยังประกอบด้วยพระราชกรณียกิจด้านการสืบสานวัฒนธรรมและขนบธรรมเนียมประเพณี และพระราชพิธีในพระบาทสมเด็จพระมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร รัชกาลที่ ๙ ที่พระองค์มีพระราชประสงค์ให้ดำรงอยู่เป็นเอกลักษณ์ของชาติ ตราบนานเท่านาน ภายในเล่มมีเนื้อหาต่อไปนี้

* '''ธรรมิกราชา'''
:1. การเข้ารับตำแหน่งประมุขของประเทศ
:2. หลักธรรมที่พระราชาหรือพระมหากษัตริย์ทรงพึ่งปฎิบัติ
:3. สถาบันพระมหากษัตริย์ในสังคมไทย
:4. พระบาทสมเด็จพระบรมชนกาธิเบศร มหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร ในฐานะทรงเป็นธรรมิกราชา
* พระราชกรณียกิจด้านการสืบสานวัฒนธรรมและขนบประเพณี
:1. พระราชกรณียกิจในด้านการศาสนา
::- 1.1. ทรงอุปถัมภ์[[พระพุทธศาสนา]]
::- 1.2. ทรงอุปถัมภ์[[ศาสนาอิสลาม]]
::- 1.3. ทรงอุปถัมภ์[[ศาสนาคริสต์|คริสต์ศาสนา]]
::- 1.4. ทรงอุปถัมภ์[[ศาสนาพราหมณ์]]
::- 1.5. ทรงอุปถัมภ์[[ศาสนาซิกข์]]
:2. พระราชกรณียกิจในด้านการอนุรักษ์ และสืบสานมรดกทางศิลปวัฒนธรรมไทย
::- 2.1. พระราชกรณียกิจในด้านการส่งเสริมสนับสนุนฯ
::- 2.2. พระราชกรณียกิจในด้านการส่งเสริมการสืบทอดศิลปกรรมไทย
::- 2.3. พระราชกรณียกิจในด้านการส่งเสริมการใช้[[ภาษาไทย]]
::- 2.4. พระราชกรณียกิจในด้านการสืบทอดขนบประเพณ
::* '''พระราชพิธีในพระบาทสมเด็จพระบรมชนกาธิเบศร มหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร'''
''พระราชพิธีประจำ''
:1. พระราชพิธีบำเพ็ญพระราชกุศลทางพระพุทธศาสนา
::- 1.การพระราชกุศล[[วันมาฆบูชา|มาฆบูชา]] 2.การพระราชกุศล[[วันวิสาขบูชา|วิสาขบูชา]] 3.การพระราชกุศลทรงผนวชและ[[อุปสมบท]]นาคหลวง 4.การพระราชพิธีทรงบำเพ็ญพระราชกุศลเนื่องใน[[วันอาสาฬหบูชา]]และ[[วันเข้าพรรษา|เทศกาลเข้าพรรษา]] 5.พระกฐินหลวง
:2. พระราชพิธีที่ทรงบำเพ็ญเพื่อเป็นการเทิดพระเกียรติสมเด็จพระบูรพมหากษัตริยาธิราชเจ้า ที่มีพระมหากรุณาธิคุณแก่บ้านเมืองในกาลก่อน
::- 1.รัฐพิธีพระบรมราชานุสรณ์[[สมเด็จพระนเรศวรมหาราช]] 2.[[วันจักรี|วันพระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลกมหาราช]] 3.[[วันปิยมหาราช]] 4.วัน[[สมเด็จพระเจ้ากรุงธนบุรี|สมเด็จพระเจ้าตากสินธนบุรี]]
:3. พระราชพิธีที่ทรงบำเพ็ญเพื่อความไพบูลย์ และความเป็นสิริมงคลแก่บ้านเมือง
::- 1.พระราชพิธี[[สงกรานต์]] 2.พระราชพิธี[[ฉัตรมงคล]] 3.พระราชพิธี[[แรกนาขวัญ|พืชมงคลจรดพระนังคัลแรกนาขวัญ]] 4.[[พระราชพิธีเฉลิมพระชนมพรรษาในพระบาทสมเด็จพระมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร|พระราชพิธีเฉลิมพระชนมพรรษา]]
* '''พระราชพิธีพิเศษ'''
:1. [[พระราชพิธีบรมราชาภิเษก]]
:2. การ[[พระราชพิธีบรมราชาภิเษก พุทธศักราช 2493|พระราชพิธีบรมราชาภิเษกพระบาทสมเด็จพระบรมชนกาธิเบศร มหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร พุทธศักราช 2493]]
:3. [[พระราชพิธีทรงผนวชในพระบาทสมเด็จพระมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร|พระราชพิธีทรงผนวช พุทธศักราช 2499]]
:4. พระราชพิธีมหามงคลเนื่องในโอกาสที่พระบาทสมเด็จพระบรมชนกาธิเบศร มหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร ทรงเจริญ[[พระราชพิธีมหามงคลเฉลิมพระชนมพรรษา 3 รอบ 5 ธันวาคม 2506|พระชนมพรรษาครบ 3 รอบพระนักษัตร พุทธศักราช 2506]]
:5. [[พระราชพิธีรัชดาภิเษก พ.ศ. 2514|พระราชพิธีรัชดาภิเษก พุทธศักราช 2514]]
:6. [[พระราชพิธีสถาปนาสมเด็จพระบรมโอรสาธิราชฯ สยามมกุฎราชกุมาร#พ.ศ. 2515|พระราชพิธีสถาปนา เฉลิมพระปรมาภิไธยสมเด็จพระบรมโอรสาธิราชฯ สยามมกุฎราชกุมาร พุทธศักราช 2515]]
:7. [[พระราชพิธีเฉลิมพระชนมพรรษา ครบ 50 พรรษา|พระราชพิธีเฉลิมพระชนมพรรษา ครบ 50 พรรษา พุทธศักราช 2520]]
