=== ''ฉบับผู้สูงวัย'' ===
''หนังสือสารานุกรมไทย "ฉบับผู้สูงวัย"'' เป็นหนังสือสารานุกรมภาษาไทย ภายใต้ของมูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ พิมพ์และจำหน่ายในปี พ.ศ. 2560 ในราคา 250 บาท โดยรวบรวมสาระความรู้เกี่ยวกับ[[วัยสูงอายุ|ผู้สูงวัย]] เริ่มจากวงจรชีวิต ทฤษฎี[[ชรา|ความชรา]] ผู้สูงวัยกับ[[สังคมไทย]] การเสริม[[สุขภาพ]] โรคภัยไข้เจ็บ ปัญหาของผู้สูงวัย และ[[เทคโนโลยี]]รองรับผู้สูงวัย สามารถนำความรู้ไปใช้ประโยชน์ให้ทันกับการเปลี่ยนแปลงการเข้าสู่สังคมสูงวัยของประเทศไทย ซึ่งกำลังประสบอยู่ใน[[ปัจจุบัน]]และ[[อนาคต]] ประกอบด้วยเนื้อหามีทั้งหมด 7 ตอน ดังต่อไปนี้
* '''ตอนที่ 1''' ความชราและวงจรชีวิต
* '''ตอนที่ 2''' การสูงวัยของประชากรในประเทศไทยและผลกระทบ
* '''ตอนที่ 3''' ผู้สูงวัยและสังคมไทย
* '''ตอนที่ 4''' การเสริมสร้างสุขภาพเพื่อวัยสูงอายุ
* '''ตอนที่ 5''' สุขภาพผู้สูงวัยไทยและปัญหาสำคัญ
* '''ตอนที่ 6''' สภาพแวดล้อมและเทคโนโลยีเพื่อวัยสูงอายุ
* '''ตอนที่ 7''' การเตรียมความพร้อมสำหรับวัยสูงอายุ

=== ฉบับสาระรอบรู้สำหรับเด็ก ===
''สารานุกรมไทยสำหรับเยาวชนฯ ฉบับสาระรอบรู้สำหรับเด็ก'' ของมูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ จัดทำในรูปแบบ[[การ์ตูน]] พิมพ์ 4 สีตลอดเล่ม เนื้อเรื่องเกี่ยวกับการผจญภัยของเด็ก[[ประถมศึกษา|วัยประถม]]กับ[[เพื่อน|ผองเพื่อน]]ต่างภพ ที่ได้รับภารกิจในการคลี่คลายปม[[ปริศนา]]ในสถานการณ์ต่าง ๆ โดยใช้ความรู้จากหนังสือสารานุกรมไทยสำหรับเยาวชนฯ ในเรื่องต่าง ๆ มาใช้ประกอบการแก้ไขปัญหาเฉพาะหน้า โดยในเล่มมีเนื้อหาดังต่อไปนี้

* '''ชุดที่ 1'''
** เล่มที่ 1 แผ่นดินไทยของเรา: พิมพ์ขึ้นใน พ.ศ. 2564
** เล่มที่ 2 โลกเก่าผสานใหม่: เร็วๆนี้
** เล่มที่ 3 ผจญภัยเพิ่มพลังชีวิต: เร็วๆนี้
** เล่มที่ 4 สร้างมิตรเสริมไมตรี: เร็วๆนี้

=== ฉบับการ์ตูน ===
''สารานุกรมไทยสำหรับเยาวชนฯ ฉบับการ์ตูน'' เป็นสารานุกรมภาษาไทย จัดทำในรูปแบบการ์ตูน จัดทำโดยมูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ ร่วมกับ[[มหาวิทยาลัยราชภัฏอุดรธานี#ศูนย์การศึกษา|ศูนย์วัฒนธรรมการอ่านอีสานบ้านเฮา มหาวิทยาลัยราชภัฏอุดรธานี]] พิมพ์ขึ้นเมื่อปี พ.ศ. 2568 รวมทั้งหมด 8 เล่มมีเนื้อหาดังต่อไปนี้

* 1. [[ไส้เดือนดิน]]
* 2. ฮัก[[แมว]]
* 3. [[ต้มยำกุ้ง]]
* 4. [[โรคภูมิแพ้]]
* 5. [[ฝุ่นละออง#ปัญหาสุขภาพ|PM2.5]]
* 6. ทำไมคน[[พูด]]ได้
* 7. [[ดวงอาทิตย์]]
* 8. [[ดาวหาง]]

=== ประมวลพระบรมราโชวาทและพระราชดำรัส ===
'''''ประมวลพระบรมราโชวาทและพระราชดำรัส พระบาทสมเด็จพระบรมชนกาธิเบศร มหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร ที่เกี่ยวกับสารานุกรมไทยสำหรับเยาวชนฯ''''' เป็นหนังสือที่จัดทำโดยมูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ พิมพ์และจำหน่ายในปี พ.ศ. 2568 โดยรวบรวมพระบรมราโชวาทและพระราชดำรัสของพระบาทสมเด็จพระบรมชนกาธิเบศร มหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร ที่เกี่ยวข้องกับสารานุกรมไทยสำหรับเยาวชนฯ มาตั้งแต่อดีตจนถึงปัจจุบัน

== กิจกรรม ==
=== ''โครงการสร้างปัญญาเฉลิมพระเกียรติ'' ===
ศาสตราจารย์พิเศษธงทอง จันทรางศุ กรรมการและเลขาธิการมูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ แถลงข่าว “โครงการสร้างปัญญาเฉลิมพระเกียรติ” เพื่อเฉลิมพระเกียรติพระบาทสมเด็จพระวชิรเกล้าเจ้าอยู่หัว เนื่องในโอกาส[[พระราชพิธีมหามงคลเฉลิมพระชนมพรรษา 6 รอบ 28 กรกฎาคม 2567]] โดยมี ดร.[[สุเมธ เตชะไกรศรี]] ที่ปรึกษาสภาผู้ว่าการไลออนส์สากลภาครวม 310 นาย[[ชาญวิทย์ อมตะมาทุชาติ]] อดีตรองเลขาธิการคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติ เข้าร่วม ณ ห้องประชุมมูลนิธิฯ ชั้น 1 สนามเสือป่า เขตดุสิต กรุงเทพมหานคร<ref>{{Cite web |last=วิชานนท์ |first=ดูเรื่องทั้งหมดโดย อานนท์ |date=2024-04-29 |title=“ธงทอง” ตั้งเป้า “โครงการสร้างปัญญาเฉลิมพระเกียรติ” เป็นสื่อกลาง ส่งต่อหนังสือสารานุกรมไทยสำหรับเยาวชนฯ สู่สถานศึกษาทุกสังกัดทั่วประเทศ |url=https://moe360.blog/2024/04/29/moe-thai-encyclopedia/ |access-date=2026-05-30 |website=ศธ.360 องศา |language=th}}</ref><ref>{{Cite web |last=matichon |date=2024-04-29 |title=ศ.พิเศษ ธงทอง แถลงข่าว ‘โครงการสร้างปัญญาเฉลิมพระเกียรติ’ เชิญชวนสนับสนุนสารานุกรมไทยสำหรับเยาวชนฯ ความรู้ไทย-สากลครบครัน |url=https://www.matichon.co.th/local/education/news_4551151 |access-date=2026-05-30 |language=th}}</ref>

=== ''ความรู้หลายเรื่อง เนื่องในวันเฉลิมฯ'' ===

ในปี พ.ศ. 2567 ซึ่งเป็นปีเฉลิมพระเกียรติพระบาทสมเด็จพระวชิรเกล้าเจ้าอยู่หัว ในโอกาสพระราชพิธีมหามงคลเฉลิมพระชนมพรรษา 6 รอบ 28 กรกฎาคม 2567 มูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ ได้จัดพิมพ์สารานุกรมไทยสำหรับเยาวชนฯ ฉบับเสริมการเรียนรู้ เล่ม 23 ขึ้น ประกอบด้วย 3 เรื่อง คือ พระราชพิธีเฉลิมพระชนมพรรษา พระพุทธรูปสำคัญในพระมหากษัตริย์แห่งกรุงรัตนโกสินทร์ และนวัคคหายุสมธัมม์ ในโอกาสนี้มูลนิธิโครงการสารานุกรมไทยสำหรับเยาวชนฯ จัดงานเสวนาเรื่อง ''“ความรู้หลายเรื่อง เนื่องในวันเฉลิมฯ”'' ณ ห้องสุรเกียรติ์ เสถียรไทย [[คณะนิติศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย]] นำโดย ศาสตราจารย์พิเศษ [[ธงทอง จันทรางศุ]] และรองศาสตราจารย์ ดร. [[ชัชพล ไชยพร]] ร่วมวงเสวนา

